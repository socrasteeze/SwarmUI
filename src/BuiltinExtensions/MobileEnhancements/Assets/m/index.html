<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real values in the installed PWA.
         interactive-widget=resizes-content is Chromium-only (iOS Safari ignores it) - harmless to ship, but it
         buys nothing on the primary target platform, so never treat it as the iOS keyboard solution.

         NOTE: this meta is REWRITTEN at runtime by mobile_core.js's fixViewport() (loaded below), which drops
         maximum-scale. It is left here without maximum-scale so the static file and the runtime result agree -
         a reader should not have to run the app to learn what the viewport actually ends up being.

         History, because it will otherwise get "fixed" back: this file used to pin maximum-scale=1, arguing that
         since iOS 10 Safari ignores scale limits for user-initiated pinch and honours them only for automatic
         focus zoom. The first half is right; the second half was an inference from an on-device observation, not
         a documented contract. And it is not free: Android Chrome/Firefox DO honour maximum-scale, so it
         suppressed real pinch zoom there, and maximum-scale < 2 is the documented WCAG 1.4.4 failure that
         axe-core flags. The correct fix for focus zoom is the 16px floor on every focusable field (m.css), which
         is verified complete across every input/select/textarea in this client. If focus zoom is ever observed
         again on device, find the actual cause - a field under 16px, or a layout wider than the viewport
         triggering Safari's shrink-to-fit - rather than reinstating this. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SwarmUI Mobile</title>
    <link rel="icon" href="/favicon.ico" />
    [HEADEXTRA]
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css?vary=[VARY]" />
    <link rel="stylesheet" href="/css/themes/modern.css?vary=[VARY]" />
    <link rel="stylesheet" href="/css/themes/modern_dark.css?vary=[VARY]" />
    <link rel="stylesheet" href="/ExtensionFile/MobileEnhancementsExtension/Assets/m/m.css?vary=[VARY]" />
    <!-- TagDex dataset sheet styling. Loaded by explicit URL for the same reason as its two scripts below: /simple
         builds its own asset list rather than using WebServer.PageHeaderExtra, so another extension has no
         injection hook here. Must come after m.css, whose conventions it layers on. -->
    <link rel="stylesheet" href="/ExtensionFile/TagDexExtension/Assets/m_tagdex.css?vary=[VARY]" />
    <script>window.parameter_remaps = [REMAPS];</script>
    <script defer src="/js/lib/jquery.min.js"></script>
    <script defer src="/js/lib/bootstrap.min.js"></script>
    <script defer src="/js/util.js?vary=[VARY]"></script>
    <script defer src="/js/translator.js?vary=[VARY]"></script>
    <script defer src="/js/permissions.js?vary=[VARY]"></script>
    <script defer src="/js/site.js?vary=[VARY]"></script>
    <!-- MobileEnhancements core. A ScriptFiles entry, so it auto-injects on every Razor page but NOT here - /simple
         builds its own script list. Loaded explicitly because /simple is the manifest's start_url and therefore the
         primary installed-PWA surface, yet was the one surface missing all three things this file provides:
           1. Service worker registration. Without it /simple had NO worker at all (verified: 0 registrations), so
              the offline fallback and installability criteria never applied to the app users actually install.
           2. --safe-top. iOS reports env(safe-area-inset-top) as 0 for home-screen web apps even under
              black-translucent (which MobileEnhancementsExtension injects), so the header rendered behind the
              clock / Dynamic Island. m.css now consumes var(--safe-top, env(...)) - see the .m-app rule.
           3. body.pwa-standalone / body.coarse-pointer classes.
         DELIBERATE SIDE EFFECT: its fixViewport() rewrites the viewport meta above and drops `maximum-scale=1`,
         restoring pinch zoom. That is intended - maximum-scale=1 is the documented WCAG 1.4.4 failure pattern and
         the 16px focusable-field floor (m.css) is the correct fix for focus zoom, which is already fully in place.
         This also makes /simple match the genpage, which has run without maximum-scale since mobile_core shipped.
         Must load BEFORE the m_* scripts so the body classes and --safe-top exist before first paint/layout.
         `defer` is required: the constructor touches document.body. -->
    <script defer src="/ExtensionFile/MobileEnhancementsExtension/Assets/mobile_core.js?vary=[VARY]"></script>
    <script defer src="/ExtensionFile/MobileEnhancementsExtension/Assets/m/m_state.js?vary=[VARY]"></script>
    <script defer src="/ExtensionFile/MobileEnhancementsExtension/Assets/m/m_gen.js?vary=[VARY]"></script>
    <script defer src="/ExtensionFile/MobileEnhancementsExtension/Assets/m/m_ui.js?vary=[VARY]"></script>
    <script defer src="/ExtensionFile/MobileEnhancementsExtension/Assets/m/m_autocomplete.js?vary=[VARY]"></script>
    <!-- TagDex character/artist picker. Loaded by explicit URL because /simple builds its own script list rather
         than using WebServer.PageFooterExtra, so another extension has no injection hook here. tagdex_core.js is a
         ScriptFiles entry of TagDexExtension, which is still fetchable at this route; m_tagdex.js is an OtherAssets
         entry so it does not also load on every Razor page. Must come after m_autocomplete.js (it wraps
         MAutoComplete) and before m_create.js. -->
    <script defer src="/ExtensionFile/TagDexExtension/Assets/tagdex_core.js?vary=[VARY]"></script>
    <script defer src="/ExtensionFile/TagDexExtension/Assets/m_tagdex.js?vary=[VARY]"></script>
    <script defer src="/ExtensionFile/MobileEnhancementsExtension/Assets/m/m_create.js?vary=[VARY]"></script>
    <script defer src="/ExtensionFile/MobileEnhancementsExtension/Assets/m/m_images.js?vary=[VARY]"></script>
    <script defer src="/ExtensionFile/MobileEnhancementsExtension/Assets/m/m_models.js?vary=[VARY]"></script>
    <script defer src="/ExtensionFile/MobileEnhancementsExtension/Assets/m/m_app.js?vary=[VARY]"></script>
</head>
<body class="m-body">
    <!-- UPSTREAM COUPLING (site.js landmine 1): site.js top-level runs
         `inputBrowserHelper = new InputBrowserHelper()` which getRequiredElementById's this container and
         THROWS without it, killing everything after site.js:1142. Keep this div. -->
    <div id="input_image_browser_upload_container" style="display:none"></div>
    <!-- UPSTREAM COUPLING (site.js landmine 2): showError() - the default error path of genericRequest and
         makeWSRequest - hard-requires center_toast/error_toast_box/error_toast_content. [TOAST] is built
         server-side by the same WebUtil.Toast helper _Layout.cshtml uses, so the markup cannot drift. -->
    [TOAST]

    <div class="m-app">
        <header class="m-header">
            <span class="m-header-title">SwarmUI</span>
            <span class="m-queue-chip" style="display:none">0</span>
            <a class="m-header-link" href="/Text2Image">Classic UI</a>
        </header>
        <main class="m-panels">
            <section class="m-panel" data-mtab="create"></section>
            <section class="m-panel" data-mtab="images"></section>
            <section class="m-panel" data-mtab="models"></section>
            <section class="m-panel" data-mtab="more"></section>
        </main>
        <nav class="m-bottom-nav">
            <button class="m-nav-item" data-mdest="create"><span class="m-nav-icon">&#x270E;</span>Create</button>
            <button class="m-nav-item" data-mdest="images"><span class="m-nav-icon">&#x25A6;</span>Images</button>
            <button class="m-nav-item" data-mdest="models"><span class="m-nav-icon">&#x25C8;</span>Models</button>
            <button class="m-nav-item" data-mdest="more"><span class="m-nav-icon">&#x2630;</span>More</button>
        </nav>
    </div>
    <div class="m-boot-fail" style="display:none">
        <p>The mobile client failed to start. This usually means an update changed something it depends on.</p>
        <p><a href="/Text2Image">Open the full UI instead</a></p>
    </div>
</body>
</html>
